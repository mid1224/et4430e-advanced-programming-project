spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/student_score_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root} # Enter your database username here
    password: ${DB_PASSWORD:} # Enter your database password here
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
  thymeleaf:
    cache: false
  sql:
    init:
      mode: always

server:
  port: 8080
